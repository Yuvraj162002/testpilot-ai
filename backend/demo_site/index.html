<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AcmeCart – Shop</title>
  <link rel="stylesheet" href="/demo/style.css">
</head>
<body>
  <header></header>
  <main>
    <h1>New arrivals</h1>
    <div class="grid" id="products"></div>
    <div class="success hidden" id="added" role="status"></div>
  </main>
  <script src="/demo/shop.js"></script>
  <script>
    document.getElementById('products').innerHTML = PRODUCTS.map(p => `
      <div class="card">
        <div class="img"></div>
        <h3>${p.name}</h3>
        <p>$${p.price}</p>
        <button class="primary" data-id="${p.id}" aria-label="Add ${p.name} to cart">Add to cart</button>
      </div>`).join('')
    document.querySelectorAll('[data-id]').forEach(b => b.onclick = () => {
      cart.add(+b.dataset.id)
      document.getElementById('cart-count').textContent = cart.count()
      const msg = document.getElementById('added')
      msg.textContent = 'Added to cart'
      msg.classList.remove('hidden')
    })
  </script>
</body>
</html>
