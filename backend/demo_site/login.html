<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AcmeCart – Sign in</title>
  <link rel="stylesheet" href="/demo/style.css?v=2">
</head>
<body>
  <header></header>
  <main class="center">
    <div class="card auth">
      <h1>Sign in</h1>
      <p class="muted">Demo account: demo@acmecart.test / demo1234</p>
      <label for="email">Email</label><input id="email" type="email">
      <label for="password">Password</label><input id="password" type="password">
      <div id="message" role="alert"></div>
      <button class="primary wide" id="sign-in" style="margin-top:16px">Sign in</button>
    </div>
  </main>
  <script src="/demo/shop.js?v=2"></script>
  <script>
    document.getElementById('sign-in').onclick = async () => {
      const res = await fetch('/demo/api/login', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }),
      })
      const data = await res.json()
      if (data.ok) document.querySelector('main').innerHTML = `<div class="card auth done"><div class="check" aria-hidden="true">✓</div><h1>Welcome back, ${data.name}!</h1><p>You are signed in.</p></div>`
      // PLANTED BUG 3: a wrong password shows no error message at all.
    }
  </script>
</body>
</html>
