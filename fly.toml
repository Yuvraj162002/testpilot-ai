# Hosted demo on Fly.io. Public mode: access codes (admin page at /#admin), each tester brings their own
# Anthropic key, private URLs are blocked, Android is off. Setup steps: README "Deploy (hosted demo)".
app = "testpilot-ai"  # must be unique on Fly: change it if taken
primary_region = "bom"

[build]
  dockerfile = "Dockerfile"

[env]
  PUBLIC_MODE = "1"
  MAX_BROWSERS = "2"
  EVIDENCE_DIR = "/app/backend/data/runs"  # screenshots on the volume too, so they survive restarts

[http_service]
  internal_port = 8000
  force_https = true
  # Runs happen in the background: a stopped machine would kill them mid-test.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

# Access codes and run history live in SQLite: keep them across restarts. One volume = one machine,
# which the app needs (runs and their polling must hit the same machine).
[mounts]
  source = "testpilot_data"
  destination = "/app/backend/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 2
